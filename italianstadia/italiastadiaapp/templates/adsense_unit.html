{% if adsense_client and adsense_slot %}
<div class="my-3">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ adsense_client }}"
         data-ad-slot="{{ adsense_slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
