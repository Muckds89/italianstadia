{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export Error — Stadiums of Europe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#12151e; color:#e0e6f0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { background:#1a1f2e; border:1px solid #2a3045; border-radius:12px; padding:2.5rem; max-width:480px; width:100%; text-align:center; }
        .icon { font-size:3rem; margin-bottom:1rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">❌</div>
    <h2 class="fw-bold mb-2">Something went wrong</h2>
    <p class="text-secondary mb-4">{{ msg }}</p>
    <a href="{% url 'italiastadiaapp:export_page' %}" class="btn btn-outline-light w-100 mb-2">Try again</a>
    <a href="/" class="btn btn-sm btn-outline-secondary w-100">Back to map</a>
</div>
</body>
</html>
