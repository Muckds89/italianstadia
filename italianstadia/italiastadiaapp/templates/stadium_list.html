<!DOCTYPE html>
<html>
<head>
    <title> Stadium List</title>
</head>
<body>
    <h1> Stadium List</h1>
    <a href="{% url 'index' %}">Back to Index</a>
    <ul>
        {% for stadium in stadia %}
            <li>{{ stadium.name }} - Capacity: {{ stadium.capacity }} - Address: {{ stadium.address }} - Year of Construction: {{ stadium.year_of_construction }} - Average Attendance: {{ stadium.average_attendance }}</li>
        {% endfor %}
    </ul>
</body>
</html>
