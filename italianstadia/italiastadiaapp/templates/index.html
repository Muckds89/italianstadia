{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Italian Stadia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Italian Stadia</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/stadia/">Stadia</a></li>
                <li class="nav-item"><a class="nav-link" href="/teams/">Teams</a></li>
                <li class="nav-item"><a class="nav-link" href="/cities/">Cities</a></li>
            </ul>

            <select id="tierFilter" class="form-select w-auto">
                <option value="">All leagues</option>
                <option value="1">Serie A</option>
                <option value="2">Serie B</option>
                <option value="3">Serie C</option>
                <option value="4">Serie D</option>
            </select>
        </div>
    </div>
</nav>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/map.js' %}?v=3"></script>

</body>
</html>
