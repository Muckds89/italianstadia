{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Stadiums of Italy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>
        .mode-switch-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 24px;
            color: white;
            white-space: nowrap;
        }

        .mode-label {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.45;
        }

        .mode-label.active {
            opacity: 1;
        }

        .mode-switch {
            position: relative;
            display: inline-block;
            width: 74px;
            height: 36px;
            margin: 0;
        }

        .mode-switch input[type="checkbox"] {
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            pointer-events: none;
        }

        .mode-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: linear-gradient(135deg, #00c853, #00e5ff);
            border-radius: 999px;
            transition: 0.25s;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.4);
        }

        .mode-slider::before {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            left: 4px;
            top: 4px;
            background: white;
            border-radius: 50%;
            transition: 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.45);
        }

        .mode-switch input:checked + .mode-slider {
            background: linear-gradient(135deg, #ffc107, #ff1744);
        }

        .mode-switch input:checked + .mode-slider::before {
            transform: translateX(38px);
        }
        .navbar-brand {
            font-size: clamp(18px, 1.4vw, 28px);
            white-space: nowrap;
        }

        .nav-link,
        .mode-label {
            font-size: clamp(13px, 1vw, 18px);
            white-space: nowrap;
        }

        .mode-switch-wrap {
            gap: 8px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .mode-switch {
            width: clamp(54px, 5vw, 74px);
            height: clamp(28px, 2.6vw, 36px);
        }

        .mode-slider::before {
            width: calc(clamp(28px, 2.6vw, 36px) - 8px);
            height: calc(clamp(28px, 2.6vw, 36px) - 8px);
        }

        .mode-switch input:checked + .mode-slider::before {
            transform: translateX(clamp(26px, 2.5vw, 38px));
        }

        .filter-area {
            min-width: 0;
            flex-shrink: 1;
        }

        #operationalFilters,
        #developmentFilters {
            min-width: 0;
            flex-shrink: 1;
        }

        #operationalFilters select,
        #developmentFilters select {
            width: clamp(120px, 11vw, 210px) !important;
            min-width: 0;
            font-size: clamp(13px, 1vw, 18px);
        }

        #stadiumFilter,
        #developmentStadiumFilter {
            width: clamp(180px, 20vw, 420px) !important;
        }

        #stadiumCounter {
            white-space: nowrap;
            font-size: clamp(12px, 0.9vw, 16px);
        }
        </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark fixed-top py-0">
    <div class="container-fluid flex-wrap py-1">

        <a class="navbar-brand" href="/">Stadiums of Italy</a>

        <!-- LEFT LINKS -->
        <ul class="navbar-nav flex-row me-auto">
            <li class="nav-item">
                <a class="nav-link px-2" href="{% url 'italiastadiaapp:stadium_list' %}">Stadiums</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" href="{% url 'italiastadiaapp:team_list' %}">Teams</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" href="{% url 'italiastadiaapp:city_list' %}">Cities</a>
            </li>
        </ul>

        <div class="mode-switch-wrap">
            <span id="operationalLabel" class="mode-label active">Operational</span>
            <label class="mode-switch">
                <input type="checkbox" id="mapModeToggle">
                <span class="mode-slider"></span>
            </label>
            <span id="developmentLabel" class="mode-label">Under Development</span>
        </div>

        <!-- Flex break: push filters to second row -->
        <div class="w-100"></div>

        <!-- FILTER AREA — second row -->
        <div class="d-flex align-items-center flex-wrap gap-2 pb-1 w-100">
            <div id="operationalFilters" class="d-flex align-items-center flex-wrap gap-2">
                <select id="countryFilter" class="form-select">
                    <option value="">All countries</option>
                </select>

                <select id="leagueFilter" class="form-select">
                    <option value="">All leagues</option>
                </select>

                <select id="gironeFilter" class="form-select" style="display: none;">
                    <option value="">All Gironi</option>
                    <option value="A">Girone A</option>
                    <option value="B">Girone B</option>
                    <option value="C">Girone C</option>
                </select>

                <select id="ownershipFilter" class="form-select">
                    <option value="">All ownership</option>
                    <option value="PUBLIC">Public</option>
                    <option value="PRIVATE">Private</option>
                    <option value="MIXED">Mixed</option>
                    <option value="UNKNOWN">Unknown</option>
                </select>

                <select id="stadiumFilter" class="form-select">
                    <option value="">All stadiums</option>
                </select>
            </div>

            <div id="developmentFilters" class="d-none align-items-center flex-wrap gap-2">
                <select id="developmentStatusFilter" class="form-select">
                    <option value="">All statuses</option>
                </select>

                <select id="developmentYearFilter" class="form-select">
                    <option value="">All opening years</option>
                </select>

                <select id="developmentStadiumFilter" class="form-select">
                    <option value="">All projects</option>
                </select>
            </div>

            <span id="stadiumCounter" class="badge bg-light text-dark ms-auto">
                0 stadiums
            </span>
        </div>
    </div>
</nav>
<div id="map" data-countries-url="{% static 'data/ne_110m_admin_0_countries.geojson' %}"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/map.js' %}?v=10"></script>
</body>
</html>
