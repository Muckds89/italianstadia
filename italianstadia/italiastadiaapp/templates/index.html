{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Stadiums of Italy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>
        .mode-switch-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 24px;
            color: white;
            white-space: nowrap;
        }

        .mode-label {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.45;
        }

        .mode-label.active {
            opacity: 1;
        }

        .mode-switch {
            position: relative;
            display: inline-block;
            width: 74px;
            height: 36px;
            margin: 0;
        }

        .mode-switch input[type="checkbox"] {
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            pointer-events: none;
        }

        .mode-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: linear-gradient(135deg, #00c853, #00e5ff);
            border-radius: 999px;
            transition: 0.25s;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.4);
        }

        .mode-slider::before {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            left: 4px;
            top: 4px;
            background: white;
            border-radius: 50%;
            transition: 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.45);
        }

        .mode-switch input:checked + .mode-slider {
            background: linear-gradient(135deg, #ffc107, #ff1744);
        }

        .mode-switch input:checked + .mode-slider::before {
            transform: translateX(38px);
        }
        </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">Stadiums of Italy</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <!-- LEFT LINKS -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="/stadia/">Stadia</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/teams/">Teams</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cities/">Cities</a>
                </li>

            </ul>
            <div class="mode-switch-wrap">
                <span id="operationalLabel" class="mode-label active">Operational</span>

                <label class="mode-switch">
                    <input type="checkbox" id="mapModeToggle">
                    <span class="mode-slider"></span>
                </label>

                <span id="developmentLabel" class="mode-label">Under Development</span>
            </div>
<!-- FILTER AREA -->
<div class="d-flex align-items-center gap-3">

    <div id="operationalFilters" class="d-flex align-items-center gap-3">
        <select id="tierFilter" class="form-select w-auto">
            <option value="">All leagues</option>
            <option value="1">Serie A</option>
            <option value="2">Serie B</option>
            <option value="3">Serie C</option>
        </select>

        <select id="gironeFilter" class="form-select w-auto" style="display: none;">
            <option value="">All Gironi</option>
            <option value="A">Girone A</option>
            <option value="B">Girone B</option>
            <option value="C">Girone C</option>
        </select>

        <select id="ownershipFilter" class="form-select w-auto">
            <option value="">All ownership</option>
            <option value="PUBLIC">Public</option>
            <option value="PRIVATE">Private</option>
            <option value="MIXED">Mixed</option>
            <option value="UNKNOWN">Unknown</option>
        </select>

        <select id="stadiumFilter" class="form-select w-auto">
            <option value="">All stadiums</option>
        </select>
    </div>

    <div id="developmentFilters" class="d-none align-items-center gap-3">
        <select id="developmentStatusFilter" class="form-select w-auto">
            <option value="">All statuses</option>
        </select>

        <select id="developmentYearFilter" class="form-select w-auto">
            <option value="">All opening years</option>
        </select>

        <select id="developmentStadiumFilter" class="form-select w-auto">
            <option value="">All projects</option>
        </select>
    </div>

    <span id="stadiumCounter" class="badge bg-light text-dark">
        0 stadiums
    </span>

</div>
</nav>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/map.js' %}?v=8"></script>
</body>
</html>
