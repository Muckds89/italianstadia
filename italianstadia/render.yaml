services:
# PYTHON VERSION IS PINNED ON PURPOSE — DO NOT REMOVE.
# With no pin, Render builds on whatever its current default is. It moved to
# Python 3.14, and Django 5.1 does not support 3.14: django.template.context's
# BaseContext.__copy__ does `copy(super())`, and copying a super proxy under 3.14
# yields an object with no __dict__, so the next line `duplicate.dicts = ...`
# raises AttributeError. Every Django admin page 500s because
# InclusionAdminNode.render calls context.new(); the public site is unaffected
# because none of its templates take that path, which is what made it look like
# an admin-only bug rather than a runtime mismatch.
# See also .python-version, which pins the same value for local parity.
  - type: web
    name: italianstadia
    env: python
    buildCommand: ./build.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
    # Free tier = 512 MB shared across ALL workers. Without --workers, gunicorn
    # reads $WEB_CONCURRENCY (set by Render) and forks several workers, each
    # loading Pillow + the country geojson (~150 MB) → OOM. Pin to 1 worker +
    # threads (exports are I/O-bound on tile/badge fetches). --max-requests
    # recycles the worker to cap slow memory growth.
    startCommand: gunicorn italianstadia.wsgi:application --workers 1 --threads 8 --timeout 60 --max-requests 120 --max-requests-jitter 20
    envVarGroups:
      - italianstadia-env

  # Season refresh — ONCE A YEAR, 05:00 UTC on 5 August (after promotions/
  # relegations settle, around the start of the European season). Stadiums and
  # team-league assignments don't change often, so a single seasonal pass is
  # enough. Locked stadiums are skipped (see Stadium.locked). You can also run it
  # on demand any time from the Render shell: `python manage.py update_all_leagues`.
  - type: cron
    name: season-refresh
    env: python
    schedule: "0 5 5 8 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py update_all_leagues
    # Same pin as the web service: this job runs the same Django on the same
    # default runtime and would hit the same incompatibility.
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
    envVarGroups:
      - italianstadia-env
